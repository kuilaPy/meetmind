services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetmind_development
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/meetmind_development
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
